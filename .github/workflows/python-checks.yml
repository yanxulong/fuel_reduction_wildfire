name: Python checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3"
      - name: Check Python syntax
        run: python -m compileall -q run.py initialization.py tasks.py functions.py tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
